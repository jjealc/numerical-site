ry{background:linear-gradient(110deg,#d92026,#ff813e);border-color:transparent}.secondary{background:#222329}.hero-art{height:440px;border:1px solid #39333a;border-radius:28px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 40%,#aa301b50,transparent 56%),linear-gradient(140deg,#24212a,#111217 65%)}.hero-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(transparent,#000)}.hero-art img{position:absolute;top:18%;left:7%;width:86%;filter:drop-shadow(0 28px 30px #0009)}.hero-art .corner{position:absolute;bottom:24px;left:25px;color:#bfc0c7;font-size:12px;letter-spacing:.13em}.section{padding:86px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:28px}.section h2,.page h1{font-size:clamp(32px,4vw,52px);line-height:1.16;letter-spacing:-.045em;margin:8px 0}.section-intro{color:var(--muted);max-width:650px}.feature{border:1px solid #38383f;border-radius:23px;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden;background:linear-gradient(130deg,#202027,#17181e)}.feature-copy{padding:42px}.feature h3{font-size:36px;letter-spacing:-.045em;line-height:1.18;margin:14px 0}.feature p{color:#b9bac2}.feature-art{min-height:290px;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#ff763a4a,transparent 62%),#18171d}.feature-art img{width:65%;max-width:260px;filter:drop-shadow(0 20px 25px #0008)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:20px;overflow:hidden;transition:transform .2s,border-color .2s;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:#b85d42}.card-visual{height:190px;display:grid;place-items:center;position:relative;overflow:hidden}.card-visual:before{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05}.card-visual .glyph{font-size:78px;z-index:1;filter:drop-shadow(0 12px 18px #0007)}.v1{background:radial-gradient(circle at 70% 30%,#e75c2c55,transparent 55%),linear-gradient(135deg,#25202b,#121923)}.v2{background:radial-gradient(circle at 70% 30%,#ff8c3155,transparent 55%),linear-gradient(135deg,#292022,#15151c)}.v3{background:radial-gradient(circle at 70% 30%,#e64e2a55,transparent 55%),linear-gradient(135deg,#27232a,#14171e)}.card-body{padding:25px;flex:1}.card h3{font-size:23px;letter-spacing:-.03em;margin:9px 0}.card p{color:var(--muted);font-size:14px;margin:0}.tag{display:inline-block;border:1px solid #65443c;background:#412923;color:#ffab7c;border-radius:100px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.08em}.arrow{display:inline-block;color:#ff965a;font-size:13px;margin-top:20px;font-weight:800}.article-list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.article{border:1px solid var(--line);background:#1a1b20;padding:25px;border-radius:16px}.article .meta{color:#ff9a65;font-size:12px}.article h3{margin:10px 0;font-size:21px;letter-spacing:-.025em}.article p{font-size:14px;color:var(--muted)}.library{background:linear-gradient(110deg,#2a2022,#1b1c22);border:1px solid #503b39;border-radius:24px;padding:36px;display:flex;gap:35px;align-items:center}.book{width:190px;min-width:190px;aspect-ratio:3/4;border-radius:7px 16px 16px 7px;background:linear-gradient(140deg,#a81920,#e53a26 65%,#ff8843);padding:18px;box-shadow:14px 18px 28px #0007;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-5deg)}.book img{width:100%}.book strong{font-size:19px;line-height:1.18}.book small{font-size:10px;letter-spacing:.1em}.library p{color:var(--muted)}.footer{border-top:1px solid var(--line);padding:35px 0;color:#999aa4;font-size:13px}.footer-inner{display:flex;justify-content:space-between;gap:15px;align-items:center}.footer img{width:170px}.page{padding:70px 0 100px;min-height:65vh}.page .intro{color:var(--muted);max-width:750px;font-size:18px}.content{max-width:800px}.content h2{margin-top:38px;font-size:26px}.content p,.content li{color:#c2c2c9}.content a{color:#ffa36d;text-decoration:underline}.callout{border-left:3px solid #ff7b3b;background:#232127;padding:18px 22px;border-radius:0 12px 12px 0;margin:25px 0}.breadcrumbs{color:#a9a9b2;font-size:13px;margin-bottom:28px}.breadcrumbs a{color:#ff965a}.back{display:inline-block;margin-top:30px;color:#ff995c}.hidden{display:none!important}@media(max-width:850px){.hero-grid,.feature{grid-template-columns:1fr}.hero-art{height:310px}.cards{grid-template-columns:1fr}.article-list{grid-template-columns:1fr}.links{display:none;position:absolute;top:82px;left:0;right:0;background:#17181d;padding:20px 25px;flex-direction:column;align-items:start;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}.logo{width:185px}.hero{padding:65px 0}.section{padding:62px 0}.library{flex-direction:column;align-items:start}.section-head{align-items:start;flex-direction:column}.feature-copy{padding:27px}.footer-inner{flex-direction:column;align-items:start}}
</style></head><body><header class="header"><div class="wrap nav"><a href="#/" aria-label="Página inicial Numerical"><img class="logo" src="logo.png" alt="Numerical"></a><button class="menu" id="menu" aria-label="Abrir menu">☰</button><nav class="links" id="links"><a href="#/">Início</a><a href="#/artigos">Artigos</a><a href="#/estudos">Estudos</a><a href="#/biblioteca">Biblioteca</a><a href="#/sobre">Sobre</a></nav></div></header><main id="app"></main><footer class="footer"><div class="wrap footer-inner"><img src="logo.png" alt="Numerical"><span>Um projeto pessoal de estudos e compartilhamento de conhecimento. Conteúdo gratuito.</span><span>© 2026 Numerical</span></div></footer><script>
const articles=[{slug:'o-que-sao-ativos-tokenizados',title:'O que são ativos tokenizados?',cat:'Investimentos & Tokenização',desc:'Entenda a diferença entre ativos com lastro, exposição sintética e ETFs tradicionais.',body:`<p>Tokenização é a representação digital de direitos ou exposições econômicas por meio de tokens em uma blockchain. O que importa não é apenas o token: é o direito jurídico que ele representa.</p><h2>Três estruturas diferentes</h2><p><strong>ETF tradicional:</strong> você possui cotas de um fundo conforme as regras do mercado em que ele é negociado.</p><p><strong>Token com lastro:</strong> um emissor oferece um token ligado a ativos mantidos em custódia ou em garantia. O titular pode ter direitos contratuais, sem ser dono direto da cota subjacente.</p><p><strong>Exposição sintética:</strong> um contrato replica um preço por derivativos ou mecanismos similares, sem necessariamente manter o ativo de referência.</p><div class="callout">Antes de avaliar qualquer token, verifique emissor, lastro, custodiante, elegibilidade, direito de resgate, liquidez e riscos.</div>`},{slug:'ethereum-solana-carteiras',title:'Ethereum, Solana e carteiras digitais',cat:'Investimentos & Tokenização',desc:'MetaMask, Rabby, taxas de rede e como começar com segurança em ambientes de teste.',body:`<p>Ethereum e Solana são redes diferentes. Ethereum usa ETH para taxas; Solana usa SOL. Enviar tokens para a rede errada pode causar perdas.</p><h2>Carteiras</h2><p>MetaMask permite trabalhar com redes compatíveis; Rabby é especialmente voltada a aplicações EVM. A disponibilidade de redes de teste varia por versão e configuração.</p><h2>Pratique sem dinheiro real</h2><p>Use Ethereum Sepolia e Solana Devnet para entender endereços, taxas e exploradores. Tokens de teste não têm valor financeiro.</p><div class="callout">Nunca compartilhe frase-semente, senha ou chave privada. Nunca assine uma transação que não entende.</div>`},{slug:'ondo-xstocks-lastro',title:'Ondo e xStocks: o que existe por trás dos tokens?',cat:'Investimentos & Tokenização',desc:'Emissor, lastro, custódia, direitos e restrições para residentes no Brasil.',body:`<p>Produtos como SPYon, QQQon, SPYx e QQQx buscam oferecer exposição econômica a ETFs americanos. Isso não significa propriedade direta da cota do ETF.</p><h2>O que verificar</h2><p>Leia a documentação oficial do emissor, a estrutura de garantia, os prestadores de custódia, o direito de resgate e as condições de elegibilidade.</p><p>Para residentes no Brasil, regras de qualificação e distribuição podem limitar o acesso. A disponibilidade técnica em uma DEX não significa autorização jurídica.</p><div class="callout">Confirme sempre o contrato ou mint na fonte oficial. Nome, ticker e logotipo não provam autenticidade.</div>`},{slug:'spxi11-versus-tokenizados',title:'SPXI11 versus ETFs tokenizados',cat:'Investimentos & Tokenização',desc:'Uma estrutura para comparar exposição, câmbio, custos, liquidez e riscos.',body:`<p>SPXI11 é um ETF negociado na bolsa brasileira. Tokens ligados a ETFs americanos podem ter estruturas jurídicas, custódia, regras de resgate e riscos operacionais diferentes.</p><h2>Comparação correta</h2><p>Analise: índice de referência, exposição ao dólar, custo anual, spread, câmbio, taxa de rede, liquidez, tributação e proteção jurídica.</p><p>Não compare apenas o preço nominal de uma cota com o preço nominal de um token: a quantidade de ativo subjacente representada por unidade pode ser diferente.</p><div class="callout">Conteúdo educacional. Não constitui recomendação de investimento. As regras tributárias dependem da classificação de cada produto.</div>`}];
const areas=[{title:'Investimentos & Tokenização',desc:'SPXI11, ETFs, ativos tokenizados, Ethereum, Solana, stablecoins e DeFi.',glyph:'⬡',cls:'v1',slug:'investimentos'},{title:'Inteligência Artificial',desc:'Agentes de IA, automações, aplicações reais e produtividade.',glyph:'✺',cls:'v2',slug:'inteligencia-artificial'},{title:'Tecnologia & Negócios',desc:'E-commerce, infraestrutura, plataformas, dados e integrações.',glyph:'▥',cls:'v3',slug:'tecnologia-negocios'}];
const areaCards=()=>`<div class="cards">${areas.map(a=>`<a class="card" href="#/area/${a.slug}"><div class="card-visual ${a.cls}"><span class="glyph">${a.glyph}</span></div><div class="card-body"><span class="tag">EXPLORAR</span><h3>${a.title}</h3><p>${a.desc}</p><span class="arrow">Ver área ↗</span></div></a>`).join('')}</div>`;
const articleCards=(arr=articles)=>`<div class="article-list">${arr.map((a,i)=>`<a class="article" href="#/artigo/${a.slug}"><span class="meta">ESTUDO ${String(articles.indexOf(a)+1).padStart(2,'0')} · ${a.cat}</span><h3>${a.title}</h3><p>${a.desc}</p><span class="arrow">Ler artigo ↗</span></a>`).join('')}</div>`;
const library=()=>`<div class="library"><div class="book"><small>NUMERICAL · GUIA 001</small><strong>O NOVO MERCADO DOS INVESTIMENTOS TOKENIZADOS</strong><img src="icone.png" alt="Símbolo Numerical"><small>EDIÇÃO 2026</small></div><div><span class="eyebrow">BIBLIOTECA GRATUITA</span><h2>Conhecimento para guardar e consultar.</h2><p>Um guia introdutório sobre ETFs, blockchain, carteiras, ativos tokenizados e riscos. Download livre, sem cadastro.</p><a class="btn primary" href="assets/guia-tokenizacao.pdf" download>↓ Baixar e-book em PDF</a></div></div>`;
const home=()=>`<section class="hero"><div class="wrap hero-grid"><div><span class="eyebrow">NUMERICAL / CONHECIMENTO EM MOVIMENTO</span><h1>Aprender hoje.<br><span class="gradient">Entender o amanhã.</span></h1><p class="lead">Um laboratório pessoal para explorar investimentos, inteligência artificial e tecnologia. O que aprendo, experimento e descubro, compartilho aqui — gratuitamente.</p><div class="actions"><a class="btn primary" href="#/estudos">Explorar estudos ↗</a><a class="btn secondary" href="#/sobre">Conheça o projeto</a></div></div><div class="hero-art"><img src="assets/icone.png" alt="Símbolo de crescimento Numerical"><span class="corner">EXPLORE · APRENDA · COMPARTILHE</span></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><span class="eyebrow">COLEÇÃO EM DESTAQUE</span><h2>Investimentos tokenizados,<br>do conceito à prática.</h2></div><p class="section-intro">Uma sequência de estudos sobre blockchain, stablecoins, ETFs e novos formatos de investimento.</p></div><div class="feature"><div class="feature-copy"><span class="tag">COLEÇÃO 001</span><h3>O novo mercado dos investimentos tokenizados</h3><p>Entenda as tecnologias, compare estruturas e conheça os riscos antes de pensar em investir.</p><div class="actions"><a href="#/estudos" class="btn primary">Acompanhar estudos ↗</a><a href="assets/guia-tokenizacao.pdf" download class="btn secondary">↓ E-book gratuito</a></div></div><div class="feature-art"><img src="icone.png" alt="Ícone Numerical"></div></div></div></section><section class="section" style="padding-top:12px"><div class="wrap"><div class="section-head"><div><span class="eyebrow">O QUE EXPLORO</span><h2>Três áreas. Muitas descobertas.</h2></div><p class="section-intro">Conteúdo organizado por temas, sem cursos, assinaturas ou barreiras de acesso.</p></div>${areaCards()}</div></section><section class="section" style="padding-top:12px"><div class="wrap"><div class="section-head"><div><span class="eyebrow">CADERNO DE ESTUDOS</span><h2>Publicações para começar.</h2></div><a class="arrow" href="#/artigos">Ver todos os artigos ↗</a></div>${articleCards()}</div></section><section class="section" style="padding-top:12px"><div class="wrap">${library()}</div></section>`;
function render(){let path=decodeURIComponent((location.hash||'#/').slice(1));let html='';if(path==='/'||path==='')html=home();else if(path==='/artigos')html=`<section class="page"><div class="wrap"><span class="eyebrow">PUBLICAÇÕES</span><h1>Artigos e anotações</h1><p class="intro">Estudos compartilhados em linguagem direta, com contexto, exemplos e atenção aos riscos.</p><div style="margin-top:35px">${articleCards()}</div></div></section>`;else if(path==='/estudos')html=`<section class="page"><div class="wrap"><span class="eyebrow">COLEÇÕES</span><h1>Estudos organizados</h1><p class="intro">Não são cursos: são séries de artigos para acompanhar um tema do início ao fim, no seu ritmo.</p><div style="margin:35px 0">${articleCards()}</div></div></section>`;else if(path==='/biblioteca')html=`<section class="page"><div class="wrap"><span class="eyebrow">DOWNLOADS GRATUITOS</span><h1>Biblioteca Numerical</h1><p class="intro">Materiais para consultar e compartilhar. Sem cadastro, sem paywall.</p><div style="margin-top:35px">${library()}</div></div></section>`;else if(path==='/sobre')html=`<section class="page"><div class="wrap content"><span class="eyebrow">SOBRE O PROJETO</span><h1>Aprender, experimentar e compartilhar.</h1><p class="intro">A Numerical é um espaço pessoal para organizar e compartilhar o que estou aprendendo sobre investimentos, inteligência artificial e tecnologia.</p><div class="content"><h2>Por que este site existe?</h2><p>Porque conhecimento se fortalece quando é explicado, documentado e colocado à prova. Aqui registro descobertas, dúvidas, estudos e ferramentas úteis.</p><h2>Como funciona?</h2><p>Artigos gratuitos, coleções de estudos e e-books para download. Sem alunos, assinaturas ou promessas de resultados.</p><div class="callout">Conteúdos sobre finanças são educativos, não recomendações de investimento. Informações e regras podem mudar; consulte fontes oficiais antes de tomar decisões.</div></div></div></section>`;else if(path.startsWith('/area/')){let a=areas.find(x=>x.slug===path.split('/')[2]);html=a?`<section class="page"><div class="wrap"><div class="breadcrumbs"><a href="#/">Início</a> / Áreas</div><span class="eyebrow">ÁREA DE CONHECIMENTO</span><h1>${a.title}</h1><p class="intro">${a.desc}</p><div style="margin-top:35px">${a.slug==='investimentos'?articleCards():`<div class="callout">Esta área está preparada para receber os próximos estudos. O conteúdo será publicado conforme os temas forem explorados.</div>`}</div><a class="back" href="#/">← Voltar ao início</a></div></section>`:''}else if(path.startsWith('/artigo/')){let a=articles.find(x=>x.slug===path.split('/')[2]);html=a?`<section class="page"><div class="wrap content"><div class="breadcrumbs"><a href="#/">Início</a> / <a href="#/artigos">Artigos</a> / ${a.cat}</div><span class="eyebrow">CADERNO DE ESTUDOS · NUMERICAL</span><h1>${a.title}</h1><p class="intro">${a.desc}</p><div class="content">${a.body}<h2>Para continuar</h2><p>Consulte a <a href="#/estudos">coleção de estudos</a> e baixe o <a href="assets/guia-tokenizacao.pdf" download>guia gratuito em PDF</a>.</p></div><a class="back" href="#/artigos">← Voltar aos artigos</a></div></section>`:''}if(!html)html='<section class="page"><div class="wrap"><h1>Página não encontrada</h1><a class="back" href="#/">← Voltar ao início</a></div></section>';document.getElementById('app').innerHTML=html;document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+path));document.getElementById('links').classList.remove('open');window.scrollTo(0,0)}document.getElementById('menu').addEventListener('click',()=>document.getElementById('links').classList.toggle('open'));window.addEventListener('hashchange',render);render();
</script></body></html>
